      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00E676" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#iconBg)"/>
  <rect x="2" y="2" width="508" height="508" rx="118" stroke="#334155" stroke-width="2.5" stroke-opacity="0.6"/>

  <ellipse cx="256" cy="400" rx="190" ry="45" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="80" y1="400" x2="432" y2="400" stroke="#1E293B" stroke-width="2" opacity="0.4"/>

  <g filter="url(#iconElevation)" transform="translate(0, 8)">
    <ellipse cx="256" cy="392" rx="140" ry="24" fill="#000000" opacity="0.6"/>

    <polygon points="126,160 174,130 174,360 126,360" fill="url(#facetFrontLit)"/>
    <polygon points="102,184 126,160 126,360 102,348" fill="url(#facetMidLit)"/>
    <polygon points="102,184 148,154 174,130 126,160" fill="url(#facetTopLit)"/>

    <polygon points="174,130 256,236 256,206 174,130" fill="#FFFFFF"/>
