    <line x1="256" y1="310" x2="256" y2="296" stroke="#070A0F" stroke-width="2.5"/>
    <line x1="268" y1="318" x2="280" y2="315" stroke="#070A0F" stroke-width="2.5"/>
    <line x1="263" y1="332" x2="272" y2="344" stroke="#070A0F" stroke-width="2.5"/>
